<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WindowsPC（カメラ・発券）｜まるごと体験ビンゴ</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/pc/pc.css">
  <script type="module" src="/pc/pc.js"></script>
</head>
<body>
  <header class="pcbar">
    <strong>WindowsPC</strong><span class="muted">カメラ3台で読取 ／ MP-B20で引換券を発券</span>
    <nav class="pclinks">
      <button type="button" class="btn btn-small" id="dash-toggle" aria-expanded="false" aria-controls="dash">玉と景品</button>
      <a class="btn btn-plain btn-small" href="/staff/" target="mb-staff">スタッフ画面</a>
      <a class="btn btn-plain btn-small" href="/admin/" target="mb-admin">管理パネル</a>
    </nav>
  </header>
  <main class="pcmain">
    <div class="left">
      <iframe id="f-camera" title="カメラ画面" src="/camera/" allow="camera"></iframe>
      <section id="dash" class="dash" hidden aria-label="玉と景品">
        <iframe id="f-balls" title="玉と景品" data-src="/balls/"></iframe>
      </section>
    </div>
    <iframe id="f-print" title="発券画面" src="/print/"></iframe>
  </main>
</body>
</html>
