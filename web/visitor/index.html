<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8643c">
  <title>まるごと体験ビンゴ｜秋のつどい</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/visitor/visitor.css">
  <script type="module" src="/visitor/main.js"></script>
</head>
<body>
  <header class="app-head">
    <svg class="app-logo" viewBox="-12 -12 24 24" aria-hidden="true" focusable="false"><g fill="#d9774a"><ellipse rx="2.6" ry="7" transform="rotate(0) translate(0 -5)"/><ellipse rx="2.6" ry="7" transform="rotate(60) translate(0 -5)"/><ellipse rx="2.6" ry="7" transform="rotate(120) translate(0 -5)"/><ellipse rx="2.6" ry="7" transform="rotate(180) translate(0 -5)"/><ellipse rx="2.6" ry="7" transform="rotate(240) translate(0 -5)"/><ellipse rx="2.6" ry="7" transform="rotate(300) translate(0 -5)"/></g><circle r="2.2" fill="#fff"/></svg>
    <div class="app-names"><p class="app-name">まるごと体験ビンゴ</p><p class="app-sub">かがやきライフタウン大垣2026</p></div>
    <button type="button" class="menu-btn" id="menu-btn" aria-label="メニュー">…</button>
  </header>
  <p id="closing-banner" class="closing-banner" role="status" hidden></p>
  <main id="main">
    <section id="view-card" class="view" data-view="card"><p class="loading">読み込み中…</p></section>
    <section id="view-map" class="view view-map" data-view="map" hidden>
      <h1 class="sr-only">会場マップ</h1>
      <div id="map-root" class="map-root"></div>
      <div class="map-controls" role="toolbar" aria-label="マップ操作">
        <button type="button" class="map-btn" data-map="in" aria-label="拡大">＋<span class="map-btn-text">拡大</span></button>
        <button type="button" class="map-btn" data-map="out" aria-label="縮小">－<span class="map-btn-text">縮小</span></button>
        <button type="button" class="map-btn" data-map="fit" aria-label="会場全体を表示">⌂<span class="map-btn-text">全体</span></button>
      </div>
      <p class="map-hint" id="map-hint">ブース・ステージをタップすると詳細</p>
      <div class="map-pick">
        <label for="map-select">ブースを選ぶ<span class="muted">（タップしにくい場合はこちら）</span></label>
        <select id="map-select"><option value="">一覧から選ぶ</option></select>
      </div>
    </section>
    <section id="view-survey" class="view" data-view="survey" hidden></section>
  </main>
  <nav class="tabs" aria-label="画面の切り替え">
    <a href="#card" data-route="card"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16" stroke="currentColor" stroke-width="1.5"/></svg>ビンゴ</a>
    <a href="#map" data-route="map"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14 M15 6v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>会場マップ</a>
    <a href="#survey" data-route="survey"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2"/></svg>アンケート</a>
  </nav>
  <dialog id="cheer" class="cheer" aria-live="polite"><img id="cheer-img" alt="" width="389" height="387"></dialog>
  <dialog id="pop" class="pop-dlg" aria-labelledby="pop-text">
    <div class="pop">
      <div class="pop-border" aria-hidden="true"></div>
      <div class="pop-body" id="pop-text"></div>
      <div class="pop-border pop-border-bottom" aria-hidden="true"></div>
    </div>
    <button type="button" class="btn btn-block pop-close" data-pop-close>閉じる</button>
  </dialog>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="detail-title"></h2>
        <button type="button" class="btn btn-plain btn-small" data-close>閉じる</button>
      </div>
      <div id="detail-body" class="sheet-body"></div>
    </div>
  </dialog>
</body>
</html>
